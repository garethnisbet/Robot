[project]
name = "robot-visualisation"
version = "0.1.0"
description = "Interactive 3D visualisation and control for robots and scientific instruments — Three.js viewer with a WebSocket remote API"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.2,<2",   # 2.x renames FastMCP (MCPServer); mcp_server.py is written for 1.x
    "websockets>=12",
    "numpy>=1.24",
]
test = [
    "pytest>=8",
    "websockets>=12",
    "numpy>=1.24",
]

[project.scripts]
robot-vis = "server:main"
robot-vis-mcp = "mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
include = [
    "server.py",
    "mcp_server.py",
    "planner.py",
    "threejs_scene.html",
    "viewer.css",
    "js/**",
    "*_config.json",
    "*_capsules.json",
    "*_scene.glb",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
