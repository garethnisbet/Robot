[project]
name = "reciprocal-space-visualisation"
version = "0.1.0"
description = "Reciprocal-space map viewer — Three.js front end served over HTTP by aiohttp"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9",
]

[project.optional-dependencies]
# The DMS (multiple-scattering) endpoint reuses the sibling DMS package, which
# pulls in numpy/scipy. Kept optional so the core viewer stays dependency-light.
dms = [
    "numpy",
    "scipy",
]
dev = [
    "numpy",
    "pytest",
]

[project.scripts]
recip-vis = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
include = [
    "server.py",
    "dms_compute.py",
    "geometry.py",
    "reciprocal_space.html",
    "viewer.css",
    "js/**",
]
